<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AmbientScribe Consultation</title>
</head>

<body>
  <header>
    <strong>AmbientScribe</strong>

    <nav>
      <a href="./index.html">Consultation</a>
      |
      <a href="./facts.html">Facts</a>
      |
      <a href="./document.html">Document</a>
    </nav>
  </header>

  <hr />

  <main>
    <h1>Consultation</h1>

    <p>
      Prototype only. Do not enter genuine patient-identifiable information.
    </p>

    <fieldset>
      <legend>Consultation controls</legend>

      <button id="start-consultation">
        Start consultation
      </button>

      <button id="end-consultation" disabled>
        End consultation
      </button>
    </fieldset>

    <p id="status-message">Ready to begin.</p>

    <section>
      <h2>Live transcript</h2>
      <div id="transcript-output">
        <p>No transcript available.</p>
      </div>
    </section>

    <section>
      <h2>Facts received</h2>
      <div id="facts-output">
        <p>No facts available.</p>
      </div>
    </section>

    <p>
      <a href="./facts.html">Review facts</a>
    </p>
  </main>

  <script src="./shared.js"></script>
  <script src="./dist/client.js"></script>

  <script>
    var session = null;

    var startButton = document.getElementById("start-consultation");
    var endButton = document.getElementById("end-consultation");
    var statusMessage = document.getElementById("status-message");
    var transcriptOutput = document.getElementById("transcript-output");
    var factsOutput = document.getElementById("facts-output");

    function displayValue(container, value) {
      var output = document.createElement("pre");

      if (typeof value === "string") {
        output.textContent = value;
      } else {
        output.textContent = JSON.stringify(value, null, 2);
      }

      container.appendChild(output);
    }

    function displaySavedInformation() {
      var transcripts = PrototypeStore.getTranscripts();
      var facts = PrototypeStore.getFacts();

      if (transcripts.length > 0) {
        transcriptOutput.replaceChildren();

        transcripts.forEach(function (transcript) {
          displayValue(transcriptOutput, transcript);
        });
      }

      if (facts.length > 0) {
        factsOutput.replaceChildren();

        facts.forEach(function (fact) {
          displayValue(factsOutput, fact);
        });
      }
    }

    function handleTranscript(message) {
      PrototypeStore.addTranscript(message);

      if (transcriptOutput.querySelector("p")) {
        transcriptOutput.replaceChildren();
      }

      displayValue(transcriptOutput, message);
    }

    function handleFact(message) {
      PrototypeStore.addFact(message);

      if (factsOutput.querySelector("p")) {
        factsOutput.replaceChildren();
      }

      displayValue(factsOutput, message);
    }

    startButton.addEventListener("click", async function () {
      startButton.disabled = true;
      statusMessage.textContent = "Starting consultation…";

      try {
        /*
         * Starting a new consultation removes information from the
         * previous prototype consultation.
         */
        PrototypeStore.clearConsultation();

        transcriptOutput.innerHTML = "<p>No transcript available.</p>";
        factsOutput.innerHTML = "<p>No facts available.</p>";

        var response = await fetch("/api/start-session", {
          method: "POST"
        });

        var data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "Could not start the session.");
        }

        PrototypeStore.setInteractionId(data.interactionId);

        session = await AmbientScribe.startSession({
          accessToken: data.accessToken,
          interactionId: data.interactionId,
          tenantName: data.tenantName,
          environment: data.environment,
          mode: "single",
          onTranscript: handleTranscript,
          onFact: handleFact
        });

        endButton.disabled = false;
        statusMessage.textContent = "Consultation running.";
      } catch (error) {
        console.error(error);

        startButton.disabled = false;
        statusMessage.textContent =
          error.message || "Could not start the consultation.";
      }
    });

    endButton.addEventListener("click", async function () {
      endButton.disabled = true;
      statusMessage.textContent = "Ending consultation…";

      try {
        if (session) {
          await session.endConsultation();
          session = null;
        }

        statusMessage.textContent =
          "Consultation ended. You can now review the facts.";

        startButton.disabled = false;
      } catch (error) {
        console.error(error);

        statusMessage.textContent =
          error.message || "Could not end the consultation.";

        endButton.disabled = false;
      }
    });

    displaySavedInformation();
  </script>
</body>
</html>
